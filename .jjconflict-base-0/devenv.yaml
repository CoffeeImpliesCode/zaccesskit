# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

# Non-OSS packages are not needed. The port links no system C library at all:
# D-Bus goes through `goose`, and upstream ships no X11 or Wayland adapter to
# port, so there are no X11, Wayland or AT-SPI development files to build
# against. See `docs/22-zig-build-surface.md`.
# allow_unfree: false

# The default openSUSE Leap host has no packages marked unsupported for it, so
# this stays at the default. Set it only if a future pin disagrees with the
# host release.
# allow_unsupported_system: false
